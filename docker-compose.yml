services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: batchnorm-classifier-api:latest
    container_name: batchnorm-api
    ports:
      - "8000:8000"
    environment:
      # Model configuration — change these to switch model
      MODEL_TYPE: ${MODEL_TYPE:-cnn}
      DATASET: ${DATASET:-cifar10}
      USE_BN: ${USE_BN:-true}

      # S3 configuration
      S3_BUCKET: ${S3_BUCKET:-data-mep-project}
      S3_MODEL_KEY: ${S3_MODEL_KEY:-models/cifar10_cnn_bn.pt}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-north-1}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
