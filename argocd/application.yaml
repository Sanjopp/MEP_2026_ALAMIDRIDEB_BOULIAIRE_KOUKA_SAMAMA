apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: batchnorm-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sanjopp/MEP_2026_ALAMIDRIDEB_BOULIAIRE_KOUKA_SAMAMA.git
    targetRevision: add-argocd
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: user-sanjopp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false