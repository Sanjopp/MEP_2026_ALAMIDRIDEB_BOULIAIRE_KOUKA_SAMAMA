[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mep_2026_alamidrideb_bouliaire_kouka_samama"
version = "0.0.1"
description = "Mise en production du projet d'Advanced ML"
authors = [
  { name = "Z. Bouliaire, H. Kouka, Z. Alami Drideb, R. Samama" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "awscli",
    "boto3>=1.42.55",
    "fastapi>=0.115.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.11.1",
    "notebook>=7.5.5",
    "numpy>=2.4.2",
    "pip",
    "python-dotenv",
    "pyyaml",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.34.0",
]
requires-python = "~=3.13.0"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit",
    "pytest",
    "detect-secrets",
    "ruff",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 99
src = ["models", "data", "src", "config", "mep_2026_alamidrideb_bouliaire_kouka_samama", "api"]

[tool.ruff.lint]
extend-select = [
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "N",    # naming
  "RUF",  # ruff-specific
]
ignore = [
  "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["mep_2026_alamidrideb_bouliaire_kouka_samama", "models", "data", "config", "api"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
